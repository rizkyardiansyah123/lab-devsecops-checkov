metadata:
  name: "S3 bucket harus memiliki tag owner dan environment"
  id: "CUSTOM_AWS_S3_TAGS"
  category: "GENERAL_SECURITY"
scope:
  provider: aws
definition:
  and:
    - cond_type: "attribute"
      resource_types:
        - "aws_s3_bucket"
      attribute: "tags.owner"
      operator: "exists"
    - cond_type: "attribute"
      resource_types:
        - "aws_s3_bucket"
      attribute: "tags.environment"
      operator: "exists"
